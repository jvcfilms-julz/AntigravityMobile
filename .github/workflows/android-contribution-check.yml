name: Validate Android copy/share contribution

on:
  push:
    branches:
      - ci/validate-android-copy-share
    paths:
      - 'android/**'
      - '.github/workflows/android-contribution-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the secured branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          # GitHub's Ubuntu runner already includes modern Android command-line
          # tools. The deprecated sdkmanager "tools" package is unavailable.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK without a release keystore
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Record artifact integrity and commit
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          git rev-parse HEAD
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-mobile-copy-share-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
