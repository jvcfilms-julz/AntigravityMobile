name: IDE chat controls validation

on:
  push:
    branches: ["feature/ide-chat-model-controls"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-security-and-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check production vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check JavaScript syntax
        run: |
          node --check src/http-server.mjs
          node --check src/ide-chat-controls.mjs
      - name: Run security and IDE controls tests
        run: node --test tests/*.test.mjs

  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK dependencies
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Configure optional stable signing from encrypted Actions secrets
        env:
          AGM_STABLE_KEYSTORE_B64: ${{ secrets.AGM_STABLE_KEYSTORE_B64 }}
          AGM_STABLE_STORE_PASSWORD: ${{ secrets.AGM_STABLE_STORE_PASSWORD }}
        run: |
          if [ -n "$AGM_STABLE_KEYSTORE_B64" ] && [ -n "$AGM_STABLE_STORE_PASSWORD" ]; then
            printf '%s' "$AGM_STABLE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/antigravity-mobile.jks"
            echo "AGM_STABLE_KEYSTORE_PATH=$RUNNER_TEMP/antigravity-mobile.jks" >> "$GITHUB_ENV"
            echo "Stable signing enabled"
          else
            echo "Build-only ephemeral debug signing; do not install as an update."
          fi
      - name: Compile Android APK
        working-directory: android
        env:
          AGM_STABLE_STORE_PASSWORD: ${{ secrets.AGM_STABLE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Record build provenance and hash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          git rev-parse HEAD
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-mobile-model-chat-validation
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
